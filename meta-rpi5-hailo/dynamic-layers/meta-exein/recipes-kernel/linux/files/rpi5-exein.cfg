# Starts the BPF LSM that meta-exein's btf.cfg builds in. The Raspberry Pi
# defconfig leaves CONFIG_LSM empty, and Pulsar loads its eBPF LSM programs only
# when "bpf" is in /sys/kernel/security/lsm.
#
# Only "bpf" is started here. Add names in front of it if you want more, for
# example "apparmor,bpf".
CONFIG_LSM="bpf"
