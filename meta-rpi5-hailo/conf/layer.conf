# Layer configuration for meta-rpi5-hailo.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi5-hailo"
BBFILE_PATTERN_rpi5-hailo = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi5-hailo = "9"

# The xtensor and xtl appends only make sense when meta-hailo-tappas is in
# bblayers.conf. Loading them without it would be dangling appends, which
# bitbake treats as an error.
BBFILES_DYNAMIC += "meta-hailo-tappas:${LAYERDIR}/dynamic-layers/meta-hailo-tappas/*/*/*.bbappend"

# The Exein Pulsar pieces (a service unit, and the kernel setting meta-exein
# cannot know about on this kernel) only load with meta-exein present.
BBFILES_DYNAMIC += " \
    meta-exein:${LAYERDIR}/dynamic-layers/meta-exein/*/*/*.bb \
    meta-exein:${LAYERDIR}/dynamic-layers/meta-exein/*/*/*.bbappend \
"

# Same series as the meta-hailo branch this layer sits on. Only wrynose is
# tested; the README says so rather than implying both have been built.
LAYERSERIES_COMPAT_rpi5-hailo = "whinlatter wrynose"

# The firmware append needs meta-hailo-accelerator. HailoRT itself also needs
# meta-oe and meta-python, which meta-hailo does not declare; the README lists
# them in bblayers.conf.
LAYERDEPENDS_rpi5-hailo = "core meta-hailo-accelerator"
